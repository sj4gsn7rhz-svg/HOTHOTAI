const SIREN_DURATIONS={1:'1분',3:'3분',5:'5분',7:'7분',10:'10분'};
const HELP_AUDIO_RATE=16000;
const sirenDock=document.querySelector('.bottom-dock');
const sirenTrigger=sirenDock.querySelector('.siren-trigger');
const sirenPanel=sirenDock.querySelector('#siren-panel');
const sirenStatus=sirenDock.querySelector('#siren-state');
const sirenPanelToggle=sirenPanel.querySelector('[data-action="help-siren"]');
let sirenClipRequest=null,helpSignal=null,helpSignalError='';
let readHelpSignalPreference=()=>{
  try{return JSON.parse(localStorage.getItem(sirenTrigger.dataset.settingsKey))?.prefs?.sirenMinutes;}
  catch{return 1;}
};
const helpSignalMinutes=()=>{
  const minutes=readHelpSignalPreference();
  return Object.hasOwn(SIREN_DURATIONS,minutes)?Number(minutes):1;
};

function loadHelpSignalClip(){
  if(window.HEAT_CHECK_EMBEDDED_SIREN)return Promise.resolve(window.HEAT_CHECK_EMBEDDED_SIREN);
  if(window.HEAT_CHECK_EMBEDDED_SIREN)return Promise.resolve(window.HEAT_CHECK_EMBEDDED_SIREN);
  if(!sirenClipRequest){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),8500);
    sirenClipRequest=fetch(sirenTrigger.dataset.clipUrl,{signal:controller.signal}).then(async response=>{
      if(!response.ok)throw Error('Could not load the siren recording.');
      return response.json();
    }).catch(error=>{
      sirenClipRequest=null;
      throw error;
    }).finally(()=>clearTimeout(timer));
  }
  return sirenClipRequest;
}

function updateHelpSignalUI(){
  const active=!!helpSignal;
  sirenTrigger.setAttribute('aria-pressed',String(active));
  sirenTrigger.querySelector('span').textContent=active?'사이렌 끄기':'도움 요청 사이렌 켜기';
  sirenDock.toggleAttribute('data-siren-active',active);
  sirenPanel.hidden=!active&&!helpSignalError;
  sirenStatus.textContent=helpSignalError||(helpSignal?.source?`약 ${helpSignal.minutes}분 동안 울린 뒤 자동으로 꺼져요.`:active?'도움 요청 소리를 준비 중이에요.':'');
  sirenPanelToggle.textContent=active?'사이렌 정지':'다시 켜기';
}

function stopHelpSignal(message='',failed=false){
  const signal=helpSignal;
  helpSignal=null;
  helpSignalError=failed?message:'';
  if(signal){
    clearTimeout(signal.timer);
    if(signal.source){
      signal.source.onended=null;
      signal.source.stop();
      signal.source.disconnect();
    }
    if(signal.audio.state!=='closed')signal.audio.close().catch(()=>{});
  }
  updateHelpSignalUI();
  if(message)document.getElementById('live').textContent=message;
}

function copyHelpAudio(samples,sampleRate,offset,length,readSample){
  const step=HELP_AUDIO_RATE/sampleRate;
  const end=Math.min(samples.length,offset+Math.ceil((length-1)/step));
  for(let i=offset;i<end;i++){
    const frame=(i-offset)*step;
    const index=Math.floor(frame),fraction=frame-index;
    samples[i]=readSample(index)*(1-fraction)+readSample(index+1)*fraction;
  }
}
function helpSignalBuffer(audio,clip){
  const {sampleRate}=audio;
  const sirenBytes=Uint8Array.from(atob(clip.siren),byte=>byte.charCodeAt(0));
  const siren=new DataView(sirenBytes.buffer),sirenLength=siren.byteLength/2;
  const voice=atob(clip.voice);
  const voiceStart=Math.round((sirenLength/HELP_AUDIO_RATE+.20)*sampleRate);
  const total=voiceStart+Math.ceil((voice.length/HELP_AUDIO_RATE+.42)*sampleRate);
  const buffer=audio.createBuffer(1,total,sampleRate);
  const samples=buffer.getChannelData(0);
  copyHelpAudio(samples,sampleRate,0,sirenLength,index=>siren.getInt16(index*2,true)/32768);
  copyHelpAudio(samples,sampleRate,voiceStart,voice.length,index=>(voice.charCodeAt(index)-128)/128);
  return buffer;
}

async function toggleHelpSignal(){
  if(helpSignal){stopHelpSignal('도움 요청 소리를 껐어요.');return;}
  helpSignalError='';
  const Audio=window.AudioContext||window.webkitAudioContext;
  const unavailable='사이렌을 재생하지 못했어요. 연결과 미디어 음량을 확인한 뒤 다시 눌러 주세요.';
  let signal;
  try{
    signal={audio:new Audio(),source:null,timer:null,minutes:helpSignalMinutes()};
    helpSignal=signal;
    updateHelpSignalUI();
    signal.timer=setTimeout(()=>stopHelpSignal(unavailable,true),10000);
    const [,clip]=await Promise.all([signal.audio.resume(),loadHelpSignalClip()]);
    if(helpSignal!==signal)return;
    clearTimeout(signal.timer);
    const source=signal.audio.createBufferSource();
    source.buffer=helpSignalBuffer(signal.audio,clip);
    source.loop=true;
    source.connect(signal.audio.destination);
    source.start();
    source.stop(signal.audio.currentTime+signal.minutes*60);
    signal.source=source;
    source.onended=()=>{
      if(helpSignal===signal)stopHelpSignal(`약 ${signal.minutes}분이 지나 도움 요청 소리가 꺼졌어요. 다시 누르면 켤 수 있어요.`);
    };
    signal.audio.addEventListener('statechange',()=>{
      if(helpSignal===signal&&signal.audio.state!=='running')stopHelpSignal(unavailable,true);
    });
    updateHelpSignalUI();
  }catch{
    if(!signal||helpSignal===signal)stopHelpSignal(unavailable,true);
  }
}

sirenDock.addEventListener('click',event=>{
  if(event.target.closest('[data-action="help-siren"]'))toggleHelpSignal();
});
document.addEventListener('click',event=>{
  if(helpSignal&&event.target.closest('a[href="tel:119"]'))stopHelpSignal();
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&helpSignal)stopHelpSignal();
});
window.addEventListener('pagehide',()=>{if(helpSignal)stopHelpSignal();});
// Download the recording after the first page is ready, or immediately on a request for help.
window.addEventListener('load',()=>{loadHelpSignalClip().catch(()=>{});},{once:true});
if(typeof ResizeObserver==='function'){
  new ResizeObserver(([entry])=>{
    document.documentElement.style.setProperty('--bottom-dock-height',`${Math.ceil(entry.target.getBoundingClientRect().height)}px`);
  }).observe(sirenDock);
}
sirenTrigger.disabled=false;
